<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>压缩气枪 · 地球大气中的飞行与消散</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#d8ffff;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:auto;padding:32px 24px}h1{font-size:30px;margin:0 0 8px}p,.note{color:#8da7be}.controls{display:flex;flex-wrap:wrap;gap:20px;align-items:center;padding:16px 0}label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select{font:inherit;background:#142238;color:#d8ffff;border:1px solid #1f6874;padding:8px;border-radius:5px}input{accent-color:#55d9d3;max-width:100%;width:180px}output{font-variant-numeric:tabular-nums}svg{display:block;width:100%;height:260px;overflow:visible;background:#142238;border-radius:8px}h2{font-size:18px;margin:24px 0 12px}.metrics{display:flex;flex-wrap:wrap;gap:24px;margin:12px 0}.metrics strong{color:#9af5e5;font-weight:500}.readout{min-height:30px;margin:10px 0;font-variant-numeric:tabular-nums}.legend{display:flex;gap:20px;color:#8da7be}.legend span::before{content:'';display:inline-block;width:24px;height:3px;margin:0 8px 4px 0;background:#55d9d3}.legend span:last-child::before{background:#5b718e}footer{color:#8da7be;margin-top:24px;font-size:14px}@media(max-width:520px){main{padding:20px 16px}.controls{display:block}.controls label{margin-bottom:16px}h1{font-size:24px}.metrics{gap:12px}}
</style>
<main><h1>压缩气枪 · 飞行与消散</h1><p>地球大气，水平向右射击。改变环境和压缩储能，观察初速、有效射程、下沉／上浮与冲击能量衰减。</p>
<div class="controls"><label>环境 <select id="environment" aria-label="大气环境"></select></label><label>压缩储能 <input id="strength" type="range" min="0" max="5" value="0" aria-label="压缩储能倍率"><output id="strengthValue"></output></label></div>
<div id="conditions" class="note"></div><div class="metrics" id="metrics" aria-live="polite"></div>
<h2>轨迹 · 高度变化（纵轴以厘米放大）</h2><svg id="trajectory" role="img" aria-label="气弹高度相对于水平距离的变化"></svg>
<h2>冲击能量 · 衰减至 12% 时转为无伤害气雾</h2><svg id="energy" role="img" aria-label="气弹剩余冲击能量相对于水平距离的变化"></svg>
<div class="legend"><span>当前储能</span><span>同环境普通射击</span></div>
<div class="controls"><label>观察飞行过程 <input id="time" type="range" min="0" max="100" value="0" aria-label="观察飞行时间"><output id="timeValue"></output></label></div><div id="readout" class="readout" aria-live="polite"></div>
<footer>曲线由游戏使用的同一模型生成；距离属于游戏调校结果。氧气团以短暂涡环保持结构，扩散时冲击力降低。热氧气团可先上浮，冷却后浮力方向可能反转；同温氧气有轻微下沉趋势，最终与空气混合。切换游戏右上角的环境选项可体验这些差异。</footer>
</main><script src="air_gun_data.js"></script><script>
const data=window.AIR_GUN_DATA,env=document.getElementById('environment'),strength=document.getElementById('strength'),clock=document.getElementById('time');
data.presets.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=p.name;env.appendChild(option)});
function el(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function plot(svg,shot,base,field,minY,maxY,axis){svg.replaceChildren();const w=Math.max(280,Math.round(svg.getBoundingClientRect().width)),h=260,left=58,right=20,top=24,bottom=40,maxX=20;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const x=v=>left+v/maxX*(w-left-right),y=v=>h-bottom-(v-minY)/(maxY-minY)*(h-top-bottom);
for(let v=0;v<=maxX;v+=w<500?5:2){svg.append(el('line',{x1:x(v),x2:x(v),y1:top,y2:h-bottom,stroke:'#263957'}));svg.append(el('text',{x:x(v),y:h-18,fill:'#8da7be','text-anchor':'middle','font-size':12},String(v)))}
for(let i=0;i<=4;i++){const v=minY+(maxY-minY)*i/4;svg.append(el('line',{x1:left,x2:w-right,y1:y(v),y2:y(v),stroke:'#263957'}));svg.append(el('text',{x:left-8,y:y(v)+4,fill:'#8da7be','text-anchor':'end','font-size':12},String(Math.round(v))))}
svg.append(el('text',{x:8,y:14,fill:'#8da7be','font-size':12},axis));svg.append(el('text',{x:w-right,y:h-2,fill:'#8da7be','text-anchor':'end','font-size':12},'水平距离 / m'));
for(const [s,color] of [[base,'#5b718e'],[shot,'#55d9d3']]){const d=s.points.map((p,i)=>`${i?'L':'M'}${x(p[1])},${y(p[field])}`).join(' ');svg.append(el('path',{d,fill:'none',stroke:color,'stroke-width':2}));}
if(field===4)svg.append(el('line',{x1:left,x2:w-right,y1:y(12),y2:y(12),stroke:'#d9854b','stroke-dasharray':'4 5'}));
const p=shot.points[Math.round(Number(clock.value)/100*(shot.points.length-1))];svg.append(el('circle',{cx:x(p[1]),cy:y(p[field]),r:5,fill:'#d8ffff',stroke:'#55d9d3'}));
const end=shot.points.at(-1),mark=el('circle',{cx:x(end[1]),cy:y(end[field]),r:4,fill:'#55d9d3'});mark.append(el('title',{},`有效射程 ${shot.range.toFixed(2)} m；${end[4].toFixed(1)}% 冲击能量`));svg.append(mark)}
function render(){const p=data.presets[Number(env.value)],shot=p.shots[Number(strength.value)],base=p.shots[0];document.getElementById('strengthValue').textContent=shot.strength.toFixed(1)+' 倍';document.getElementById('conditions').textContent=`空气 ${p.density.toFixed(3)} kg/m³ · ${p.temperature.toFixed(0)}°C · 出膛氧气 ${p.gas_temperature.toFixed(0)}°C · 水平风 ${p.wind.toFixed(0)} m/s`;
const metrics=document.getElementById('metrics');metrics.replaceChildren();for(const [name,value] of [['初速',shot.speed.toFixed(1)+' m/s'],['有效射程',shot.range.toFixed(2)+' m'],['有效飞行',shot.duration.toFixed(2)+' s']]){const span=document.createElement('span');span.append(document.createTextNode(name+' '));const strong=document.createElement('strong');strong.textContent=value;span.append(strong);metrics.append(span)}
plot(document.getElementById('trajectory'),shot,base,2,-25,10,'高度 / cm');plot(document.getElementById('energy'),shot,base,4,0,100,'剩余能量 / %');const point=shot.points[Math.round(Number(clock.value)/100*(shot.points.length-1))];document.getElementById('timeValue').textContent=point[0].toFixed(2)+' s';document.getElementById('readout').textContent=`距离 ${point[1].toFixed(2)} m · 速度 ${point[3].toFixed(1)} m/s · 冲击能量 ${point[4].toFixed(1)}% · ${point[2]>=0?'上移':'下移'} ${Math.abs(point[2]).toFixed(1)} cm · 气团温度 ${point[5].toFixed(1)}°C`}
for(const control of [env,strength,clock])control.addEventListener('input',render);window.addEventListener('resize',render);render();
</script></html>
